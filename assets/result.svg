<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="打工狗瘫在电脑前生无可恋">
  <defs>
    <clipPath id="frame2"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#frame2)">
    <!-- 背景 -->
    <rect width="800" height="600" fill="#ffffff"/>
    <circle cx="400" cy="300" r="220" fill="#f6f6f2"/>
    <circle cx="400" cy="300" r="220" fill="none" stroke="#1d1d1f" stroke-width="3"/>

    <!-- 显示器（背面视角，打工狗面对屏幕） -->
    <g>
      <rect x="316" y="150" width="168" height="120" rx="12" fill="#1d1d1f"/>
      <rect x="330" y="164" width="140" height="92" rx="6" fill="#2a2a2c"/>
      <rect x="342" y="178" width="64" height="8" rx="4" fill="#c6f432"/>
      <rect x="342" y="196" width="104" height="6" rx="3" fill="#4a4a4c"/>
      <rect x="342" y="210" width="88" height="6" rx="3" fill="#4a4a4c"/>
      <rect x="342" y="224" width="96" height="6" rx="3" fill="#4a4a4c"/>
      <rect x="384" y="270" width="32" height="14" fill="#1d1d1f"/>
      <rect x="362" y="284" width="76" height="8" rx="4" fill="#1d1d1f"/>
    </g>

    <!-- 屏幕光照射效果 -->
    <path d="M340 288 L300 420 L500 420 L460 288 Z" fill="#f6f6f2" opacity="0.9"/>

    <!-- 打工狗背影（面对屏幕瘫坐） -->
    <g>
      <!-- 身体 -->
      <ellipse cx="400" cy="392" rx="96" ry="76" fill="#e8a94e" stroke="#1d1d1f" stroke-width="5"/>
      <!-- 耳朵（从背后看，耷拉） -->
      <path d="M330 344 q-16 -40 8 -58 q22 10 24 44 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M470 344 q16 -40 -8 -58 q-22 10 -24 44 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <!-- 尾巴无力下垂 -->
      <path d="M492 420 q34 6 40 34" stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="534" cy="458" rx="12" ry="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="4" transform="rotate(40 534 458)"/>
      <!-- 头顶焦虑波浪线 -->
      <g stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M356 250 q12 -16 24 0 q12 16 24 0"/>
        <path d="M420 236 q12 -16 24 0 q12 16 24 0"/>
      </g>
      <text x="322" y="266" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d1d1f" transform="rotate(-10 322 266)">zz</text>
    </g>

    <!-- 桌面 -->
    <rect x="216" y="468" width="368" height="20" rx="10" fill="#1d1d1f"/>
    <rect x="252" y="488" width="18" height="80" fill="#1d1d1f"/>
    <rect x="530" y="488" width="18" height="80" fill="#1d1d1f"/>

    <!-- 键盘（桌上） -->
    <g>
      <rect x="330" y="440" width="140" height="26" rx="6" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
      <g stroke="#1d1d1f" stroke-width="2.5">
        <line x1="344" y1="448" x2="456" y2="448"/>
        <line x1="344" y1="456" x2="456" y2="456"/>
      </g>
    </g>

    <!-- 工牌（挂在桌边） -->
    <g transform="rotate(6 250 520)">
      <rect x="228" y="492" width="46" height="60" rx="8" fill="#c6f432" stroke="#1d1d1f" stroke-width="4"/>
      <circle cx="251" cy="512" r="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/>
      <rect x="238" y="528" width="26" height="5" rx="2.5" fill="#1d1d1f"/>
      <rect x="242" y="538" width="18" height="5" rx="2.5" fill="#1d1d1f"/>
    </g>

    <!-- 咖啡杯（倒了） -->
    <g transform="rotate(78 560 520)">
      <rect x="536" y="500" width="40" height="44" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
      <path d="M576 512 q16 8 0 20" stroke="#1d1d1f" stroke-width="4" fill="none"/>
      <path d="M548 494 q4 -10 0 -16 M562 494 q4 -10 0 -16" stroke="#d9d9d4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <ellipse cx="600" cy="548" rx="26" ry="8" fill="#8a5a22" opacity="0.55"/>

    <!-- 地面线 -->
    <line x1="180" y1="568" x2="620" y2="568" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>

    <!-- 顶部标语牌 -->
    <g transform="rotate(2 400 40)">
      <rect x="290" y="22" width="220" height="34" rx="17" fill="#c6f432" stroke="#1d1d1f" stroke-width="3.5"/>
      <text x="400" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="800" fill="#1d1d1f">生无可恋 · 持续上班</text>
    </g>

    <!-- 漂浮的KPI字样 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" fill="#1d1d1f">
      <text x="596" y="200" font-size="18" transform="rotate(8 596 200)" opacity="0.85">KPI</text>
      <text x="620" y="240" font-size="14" transform="rotate(-6 620 240)" opacity="0.6">周报</text>
      <text x="180" y="220" font-size="14" transform="rotate(-8 180 220)" opacity="0.6">加班</text>
      <text x="160" y="260" font-size="18" transform="rotate(6 160 260)" opacity="0.85">OKR</text>
    </g>
  </g>
</svg>
