<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="打工狗准点下班狂奔快乐无比">
  <defs>
    <clipPath id="frame0"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#frame0)">
    <!-- 背景 -->
    <rect width="800" height="600" fill="#ffffff"/>
    <circle cx="400" cy="300" r="220" fill="#f6f6f2"/>
    <circle cx="400" cy="300" r="220" fill="none" stroke="#1d1d1f" stroke-width="3"/>

    <!-- 太阳 -->
    <g>
      <circle cx="225" cy="155" r="28" fill="#c6f432" stroke="#1d1d1f" stroke-width="4"/>
      <g stroke="#1d1d1f" stroke-width="4" stroke-linecap="round">
        <line x1="225" y1="112" x2="225" y2="124"/>
        <line x1="225" y1="186" x2="225" y2="198"/>
        <line x1="182" y1="155" x2="194" y2="155"/>
        <line x1="256" y1="155" x2="268" y2="155"/>
        <line x1="195" y1="125" x2="204" y2="134"/>
        <line x1="246" y1="176" x2="255" y2="185"/>
        <line x1="195" y1="185" x2="204" y2="176"/>
        <line x1="246" y1="134" x2="255" y2="125"/>
      </g>
    </g>

    <!-- 白云 -->
    <g>
      <ellipse cx="556" cy="138" rx="18" ry="12" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
      <ellipse cx="578" cy="150" rx="42" ry="16" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
    </g>

    <!-- 飞出去的公文包 + 卷宗 -->
    <g>
      <rect x="196" y="368" width="64" height="46" rx="8" fill="#c6f432" stroke="#1d1d1f" stroke-width="4"/>
      <path d="M214 368 q14 -16 28 0" stroke="#1d1d1f" stroke-width="4" fill="none"/>
      <line x1="196" y1="390" x2="260" y2="390" stroke="#1d1d1f" stroke-width="3"/>
    </g>
    <path d="M296 402 Q248 348 214 366" stroke="#1d1d1f" stroke-width="3.5" fill="none" stroke-dasharray="7 7" opacity="0.7"/>
    <g transform="rotate(-18 262 300)">
      <rect x="240" y="284" width="44" height="32" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="3.5"/>
      <line x1="248" y1="294" x2="276" y2="294" stroke="#1d1d1f" stroke-width="2.5"/>
      <line x1="248" y1="302" x2="270" y2="302" stroke="#1d1d1f" stroke-width="2.5"/>
    </g>

    <!-- 狂奔的打工狗（侧身飞奔，嘴角狂喜） -->
    <g>
      <!-- 速度线 -->
      <g stroke="#1d1d1f" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <line x1="100" y1="376" x2="190" y2="376"/>
        <line x1="112" y1="398" x2="200" y2="398"/>
        <line x1="102" y1="420" x2="188" y2="420"/>
      </g>
      <!-- 向后飘的耳朵 -->
      <path d="M482 306 q-40 -22 -62 2 q24 16 48 6 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M470 318 q-44 -14 -64 10 q26 12 50 2 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <!-- 高举的尾巴 -->
      <path d="M282 372 q-34 -26 -30 -54" stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="254" cy="314" rx="11" ry="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="4" transform="rotate(-50 254 314)"/>
      <!-- 身体（前倾） -->
      <ellipse cx="380" cy="400" rx="105" ry="62" fill="#e8a94e" stroke="#1d1d1f" stroke-width="5" transform="rotate(-6 380 400)"/>
      <!-- 四条飞奔的腿 -->
      <g stroke-linecap="round" fill="none">
        <path d="M310 442 L242 474" stroke="#1d1d1f" stroke-width="21"/>
        <path d="M310 442 L242 474" stroke="#e8a94e" stroke-width="12"/>
        <path d="M324 452 L266 492" stroke="#1d1d1f" stroke-width="21"/>
        <path d="M324 452 L266 492" stroke="#e8a94e" stroke-width="12"/>
        <path d="M452 432 L522 470" stroke="#1d1d1f" stroke-width="21"/>
        <path d="M452 432 L522 470" stroke="#e8a94e" stroke-width="12"/>
        <path d="M438 442 L500 486" stroke="#1d1d1f" stroke-width="21"/>
        <path d="M438 442 L500 486" stroke="#e8a94e" stroke-width="12"/>
      </g>
      <!-- 头（回眸大笑） -->
      <circle cx="505" cy="348" r="48" fill="#e8a94e" stroke="#1d1d1f" stroke-width="5"/>
      <ellipse cx="549" cy="362" rx="20" ry="15" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
      <circle cx="561" cy="354" r="6" fill="#1d1d1f"/>
      <path d="M508 334 q10 -10 20 -1" stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M536 376 q12 12 26 4" stroke="#1d1d1f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="552" cy="394" rx="8" ry="11" fill="#c6f432" stroke="#1d1d1f" stroke-width="3.5"/>
    </g>

    <!-- 地面线 -->
    <line x1="180" y1="568" x2="620" y2="568" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>

    <!-- 顶部标语牌 -->
    <g transform="rotate(2 400 40)">
      <rect x="275" y="22" width="250" height="34" rx="17" fill="#c6f432" stroke="#1d1d1f" stroke-width="3.5"/>
      <text x="400" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="800" fill="#1d1d1f">无班一身轻 · 准点跑路</text>
    </g>

    <!-- 漂浮词 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" fill="#1d1d1f">
      <text x="628" y="215" font-size="15" transform="rotate(8 628 215)" opacity="0.7">准点下班</text>
      <text x="644" y="262" font-size="16" transform="rotate(-6 644 262)" opacity="0.85">发工资</text>
      <text x="188" y="205" font-size="16" transform="rotate(-8 188 205)" opacity="0.85">年假</text>
      <text x="172" y="250" font-size="15" transform="rotate(6 172 250)" opacity="0.7">躺平</text>
    </g>
  </g>
</svg>
