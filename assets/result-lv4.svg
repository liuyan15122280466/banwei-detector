<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="打工狗被三块屏幕包围班味爆表">
  <defs>
    <clipPath id="frame4"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#frame4)">
    <!-- 背景 -->
    <rect width="800" height="600" fill="#ffffff"/>
    <circle cx="400" cy="300" r="220" fill="#f6f6f2"/>
    <circle cx="400" cy="300" r="220" fill="none" stroke="#1d1d1f" stroke-width="3"/>

    <!-- 左右两块副屏（包围感） -->
    <g transform="rotate(-14 190 220)">
      <rect x="140" y="180" width="100" height="70" rx="8" fill="#1d1d1f"/>
      <rect x="150" y="190" width="80" height="50" rx="4" fill="#2a2a2c"/>
      <rect x="182" y="250" width="16" height="10" fill="#1d1d1f"/>
      <rect x="168" y="260" width="44" height="6" rx="3" fill="#1d1d1f"/>
    </g>
    <g transform="rotate(14 610 220)">
      <rect x="560" y="180" width="100" height="70" rx="8" fill="#1d1d1f"/>
      <rect x="570" y="190" width="80" height="50" rx="4" fill="#2a2a2c"/>
      <rect x="602" y="250" width="16" height="10" fill="#1d1d1f"/>
      <rect x="588" y="260" width="44" height="6" rx="3" fill="#1d1d1f"/>
    </g>

    <!-- 主显示器（负荷拉满） -->
    <g>
      <rect x="316" y="150" width="168" height="120" rx="12" fill="#1d1d1f"/>
      <rect x="330" y="164" width="140" height="92" rx="6" fill="#2a2a2c"/>
      <rect x="342" y="176" width="116" height="14" rx="7" fill="#c6f432"/>
      <rect x="342" y="200" width="116" height="6" rx="3" fill="#4a4a4c"/>
      <rect x="342" y="214" width="100" height="6" rx="3" fill="#4a4a4c"/>
      <rect x="342" y="228" width="108" height="6" rx="3" fill="#4a4a4c"/>
      <text x="456" y="251" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="800" fill="#c6f432">负荷 300%</text>
      <rect x="384" y="270" width="32" height="14" fill="#1d1d1f"/>
      <rect x="362" y="284" width="76" height="8" rx="4" fill="#1d1d1f"/>
    </g>

    <!-- 屏幕光照射效果 -->
    <path d="M340 288 L296 420 L504 420 L460 288 Z" fill="#f6f6f2" opacity="0.9"/>

    <!-- 打工狗背影（被三块屏包围，彻底瘫住） -->
    <g>
      <ellipse cx="400" cy="396" rx="102" ry="74" fill="#e8a94e" stroke="#1d1d1f" stroke-width="5"/>
      <path d="M326 348 q-14 -42 10 -58 q24 10 26 46 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M474 348 q14 -42 -10 -58 q-24 10 -26 46 z" fill="#8a5a22" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <!-- 尾巴彻底摊平 -->
      <path d="M498 424 q30 14 30 40" stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="530" cy="468" rx="12" ry="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="4" transform="rotate(55 530 468)"/>
      <!-- 头顶冒班味气体 -->
      <g stroke="#1d1d1f" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M362 246 q14 -20 0 -38 q-12 -16 2 -32"/>
        <path d="M400 238 q16 -22 0 -40 q-14 -16 0 -34"/>
        <path d="M438 246 q14 -20 0 -38 q-12 -16 2 -32"/>
      </g>
      <circle cx="352" cy="158" r="10" fill="#c6f432" stroke="#1d1d1f" stroke-width="4"/>
      <circle cx="448" cy="150" r="8" fill="#c6f432" stroke="#1d1d1f" stroke-width="4"/>
    </g>

    <!-- 头顶警告三角 -->
    <g transform="rotate(-4 400 120)">
      <path d="M400 96 L432 148 L368 148 Z" fill="#ffffff" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round"/>
      <rect x="396" y="112" width="8" height="18" rx="4" fill="#1d1d1f"/>
      <circle cx="400" cy="139" r="4.5" fill="#1d1d1f"/>
    </g>

    <!-- 汗滴飞溅 -->
    <g fill="#ffffff" stroke="#1d1d1f" stroke-width="4">
      <path d="M282 330 q-10 16 0 24 q12 -8 0 -24 z" transform="rotate(-24 282 330)"/>
      <path d="M522 320 q10 16 0 24 q-12 -8 0 -24 z" transform="rotate(24 522 320)"/>
      <path d="M262 386 q-9 14 0 21 q11 -7 0 -21 z" transform="rotate(-40 262 386)"/>
    </g>

    <!-- 桌面 -->
    <rect x="216" y="468" width="368" height="20" rx="10" fill="#1d1d1f"/>
    <rect x="252" y="488" width="18" height="80" fill="#1d1d1f"/>
    <rect x="530" y="488" width="18" height="80" fill="#1d1d1f"/>

    <!-- 散落的报表 -->
    <g transform="rotate(16 300 530)">
      <rect x="278" y="512" width="46" height="34" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="3.5"/>
      <line x1="286" y1="522" x2="316" y2="522" stroke="#1d1d1f" stroke-width="2.5"/>
      <line x1="286" y1="530" x2="310" y2="530" stroke="#1d1d1f" stroke-width="2.5"/>
    </g>
    <g transform="rotate(-12 510 540)">
      <rect x="488" y="522" width="46" height="34" rx="4" fill="#ffffff" stroke="#1d1d1f" stroke-width="3.5"/>
      <line x1="496" y1="532" x2="526" y2="532" stroke="#1d1d1f" stroke-width="2.5"/>
      <line x1="496" y1="540" x2="520" y2="540" stroke="#1d1d1f" stroke-width="2.5"/>
    </g>

    <!-- 地面线 -->
    <line x1="180" y1="568" x2="620" y2="568" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>

    <!-- 顶部标语牌 -->
    <g transform="rotate(-2 400 40)">
      <rect x="280" y="22" width="240" height="34" rx="17" fill="#c6f432" stroke="#1d1d1f" stroke-width="3.5"/>
      <text x="400" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="800" fill="#1d1d1f">班味入骨 · 无法拯救</text>
    </g>

    <!-- 漂浮词 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" fill="#1d1d1f">
      <text x="642" y="150" font-size="18" transform="rotate(8 642 150)" opacity="0.85">996</text>
      <text x="656" y="315" font-size="14" transform="rotate(-6 656 315)" opacity="0.6">问责</text>
      <text x="126" y="315" font-size="14" transform="rotate(-8 126 315)" opacity="0.6">复盘</text>
      <text x="116" y="150" font-size="18" transform="rotate(6 116 150)" opacity="0.85">裁员</text>
    </g>
  </g>
</svg>
